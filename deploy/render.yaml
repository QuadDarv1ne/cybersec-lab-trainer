# Render
# https://render.com/docs

services:
  - type: web
    name: cybersec-lab-trainer
    env: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    region: oregon
    branch: main
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cybersec-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: cybersec-lab-trainer
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_ID
        sync: false
      - key: GITHUB_SECRET
        sync: false

databases:
  - name: cybersec-db
    databaseName: cybersec_trainer
    user: cybersec
    plan: free
